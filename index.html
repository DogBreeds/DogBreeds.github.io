<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore dog breeds or use a simple quiz to narrow down breeds that fit your lifestyle.">
  <title>Dog Breed Finder</title>
  <link rel="stylesheet" href="styles.css?v=20260824e">
</head>
<body>
  <header class="site-header">
    <div class="header-wrap">
      <a class="site-name" href="#quiz" aria-label="Dog Breed Finder home">DOG BREED FINDER</a>
      <nav class="main-nav" aria-label="Browse dog breeds">
        <button class="nav-button nav-quiz" type="button" data-route="quiz">QUIZ</button>
        <div class="nav-group" data-nav-group>
          <button class="nav-button nav-large" type="button" aria-expanded="false" data-dropdown-trigger>LARGE <span aria-hidden="true">▾</span></button>
          <div class="dropdown" data-dropdown>
            <button type="button" data-browse="large:all">All large breeds</button>
            <button type="button" data-browse="large:beginner">Beginner-friendly</button>
            <button type="button" data-browse="large:family">Family-friendly</button>
            <button type="button" data-browse="large:working">Working &amp; sport</button>
            <button type="button" data-browse="large:low-grooming">Lower grooming</button>
            <button type="button" data-browse="large:low-energy">Lower energy</button>
          </div>
        </div>
        <div class="nav-group" data-nav-group>
          <button class="nav-button nav-medium" type="button" aria-expanded="false" data-dropdown-trigger>MEDIUM <span aria-hidden="true">▾</span></button>
          <div class="dropdown" data-dropdown>
            <button type="button" data-browse="medium:all">All medium breeds</button>
            <button type="button" data-browse="medium:beginner">Beginner-friendly</button>
            <button type="button" data-browse="medium:family">Family-friendly</button>
            <button type="button" data-browse="medium:working">Working &amp; sport</button>
            <button type="button" data-browse="medium:low-grooming">Lower grooming</button>
            <button type="button" data-browse="medium:low-energy">Lower energy</button>
          </div>
        </div>
        <div class="nav-group" data-nav-group>
          <button class="nav-button nav-small" type="button" aria-expanded="false" data-dropdown-trigger>SMALL <span aria-hidden="true">▾</span></button>
          <div class="dropdown dropdown-right" data-dropdown>
            <button type="button" data-browse="small:all">All small breeds</button>
            <button type="button" data-browse="small:beginner">Beginner-friendly</button>
            <button type="button" data-browse="small:family">Family-friendly</button>
            <button type="button" data-browse="small:working">Working &amp; sport</button>
            <button type="button" data-browse="small:low-grooming">Lower grooming</button>
            <button type="button" data-browse="small:low-energy">Lower energy</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div>Breed traits are general tendencies. Individual dogs vary.</div>
    <div><a href="#credits">Photo credits</a> · <span>As an Amazon Associate I earn from qualifying purchases.</span></div>
  </footer>

  <script src="breeds.js?v=20260824e"></script>
  <script src="app.js?v=20260824e"></script>
</body>
</html>
